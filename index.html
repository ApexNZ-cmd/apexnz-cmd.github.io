<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexNZ | Dev Website</title>
    <!-- Custom Favicon -->
    <link rel="icon" type="image/png" href="favicon_apexnz.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            purple: '#7C3AED',
                            cyan: '#06B6D4',
                            dark: '#0B0F17',
                            card: '#161F30'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-brand-dark text-slate-100 font-sans antialiased selection:bg-brand-purple selection:text-white min-h-screen flex flex-col justify-between">

    <!-- Navigation -->
    <nav class="max-w-6xl mx-auto px-6 py-6 flex justify-between items-center w-full">
        <a href="/" class="text-2xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-brand-cyan to-brand-purple">
            ApexNZ
        </a>
        <div class="flex items-center gap-4 text-sm font-medium text-slate-400">
            <a href="projects" class="hover:text-white transition font-semibold text-slate-200">Projects</a>
            <a href="https://github.com/ApexNZ-cmd" target="_blank" class="hover:text-white transition">GitHub</a>
            <a href="https://discord.gg/UrdfAN2Ju" target="_blank" class="bg-brand-purple hover:bg-purple-600 text-white px-4 py-2 rounded-lg transition flex items-center gap-2">
                <i class="fa-brands fa-discord"></i> Discord
            </a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="max-w-4xl mx-auto text-center py-20 px-6 my-auto">
        <span class="text-brand-cyan text-sm font-semibold tracking-normal uppercase bg-brand-cyan/10 px-3 py-1 rounded-full border border-brand-cyan/20">Developer Portfolio</span>
        <h1 class="text-5xl md:text-6xl font-black mt-6 mb-4 tracking-tight">
            Welcome to the official dev website of <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-purple to-brand-cyan">ApexNZ</span>
        </h1>
        <p class="text-slate-400 text-lg mb-8 max-w-2xl mx-auto">
            ApexNZ is a barebones OS dev, coder, and tech specialist.
        </p>
        <div class="flex justify-center gap-4 flex-wrap">
            <a href="projects" class="bg-brand-purple hover:bg-purple-600 text-white font-semibold px-6 py-3 rounded-xl transition shadow-lg shadow-brand-purple/20 flex items-center gap-2">
                View Projects <i class="fa-solid fa-arrow-right text-xs"></i>
            </a>
            <a href="https://github.com/ApexNZ-cmd" target="_blank" class="bg-brand-card border border-slate-700 hover:border-slate-500 text-white font-semibold px-6 py-3 rounded-xl transition flex items-center gap-2">
                <i class="fa-brands fa-github"></i> GitHub
            </a>
        </div>
    </section>

    <!-- Links & Socials -->
    <section class="max-w-4xl mx-auto text-center py-8 px-6">
        <h2 class="text-xs uppercase tracking-widest text-slate-500 font-bold mb-6">Connect With Me</h2>
        <div class="flex justify-center items-center gap-6 text-slate-400 text-2xl">
            <a href="https://discord.gg/UrdfAN2Ju" target="_blank" class="hover:text-brand-purple transition" title="Discord"><i class="fa-brands fa-discord"></i></a>
            <a href="https://github.com/ApexNZ-cmd" target="_blank" class="hover:text-white transition" title="GitHub"><i class="fa-brands fa-github"></i></a>
        </div>
    </section>

    <!-- Footer -->
    <footer class="border-t border-slate-800/60 py-8 text-center text-slate-500 text-sm">
        <p>&copy; ApexNZ. Hosted on GitHub Pages.</p>
    </footer>

</body>
</html>
